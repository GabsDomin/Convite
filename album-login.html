<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre no álbum coletivo do casamento de Gabriel e Halanaia." />
    <title>Entrar no álbum | Gabriel &amp; Halanaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/album.css?v=20261027-4" />
  </head>
  <body class="album-login-page">
    <main class="album-login">
      <a class="back-link login-back" href="/" aria-label="Voltar ao convite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        Voltar ao convite
      </a>

      <section class="album-login-card" aria-labelledby="album-login-title">
        <p class="album-login-eyebrow">Álbum coletivo</p>
        <h1 id="album-login-title"><span>Gabriel</span> <i>&amp;</i> <span>Halanaia</span></h1>
        <p class="album-login-copy" data-album-login-copy aria-live="polite">Preparando o álbum...</p>

        <div class="album-login-step" data-step="closed" hidden>
          <p class="album-login-note">O álbum abre no dia <strong>28/11, às 15h</strong>. Volte aqui na festa!</p>
        </div>

        <div class="album-login-step album-login-form" data-step="remembered" hidden>
          <div class="album-login-people" data-remembered-list role="list"></div>
          <button class="album-login-switch" type="button" data-go-search>Não sou nenhuma dessas pessoas</button>
        </div>

        <form class="album-login-step album-login-form" data-step="search" novalidate hidden>
          <label for="album-guest-search">Seu nome</label>
          <div class="album-login-combobox">
            <svg class="album-login-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
            <input
              id="album-guest-search"
              type="text"
              maxlength="80"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
              enterkeyhint="search"
              placeholder="Digite seu nome"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="album-guest-options"
              data-guest-search
            />
            <button class="album-login-clear" type="button" aria-label="Limpar busca" data-search-clear hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
            </button>
            <ul class="album-login-options" id="album-guest-options" role="listbox" data-guest-options hidden></ul>
          </div>
          <p class="album-login-hint" data-search-hint>Comece a digitar e toque no seu nome.</p>
          <label data-password-field hidden>
            Senha dos noivos
            <input name="password" type="password" maxlength="64" autocomplete="current-password" data-search-password />
          </label>
          <button class="button primary" type="submit" data-search-submit hidden>Entrar</button>
          <button class="album-login-switch" type="button" data-go-new>Não achei meu nome</button>
        </form>

        <form class="album-login-step album-login-form" data-step="new" novalidate hidden>
          <label>
            Nome e sobrenome
            <input name="guestName" type="text" maxlength="120" autocomplete="name" placeholder="Ex.: Maria Silva" data-new-name required />
          </label>
          <button class="button primary" type="submit" data-new-submit>Criar meu acesso</button>
          <button class="album-login-switch" type="button" data-go-search>Voltar para a busca</button>
        </form>

        <p class="album-login-error" data-album-login-error role="alert" hidden></p>
      </section>
    </main>

    <script src="/album-login.js?v=6"></script>
  </body>
</html>
