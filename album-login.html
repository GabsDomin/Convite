<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre no álbum coletivo do casamento de Gabriel e Halanaia." />
    <title>Entrar no álbum | Gabriel &amp; Halanaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/album.css?v=3" />
  </head>
  <body class="album-login-page">
    <main class="album-login">
      <a class="back-link login-back" href="/" aria-label="Voltar ao convite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        Voltar ao convite
      </a>

      <section class="album-login-card" aria-labelledby="album-login-title">
        <p class="album-login-eyebrow">Álbum coletivo</p>
        <h1 id="album-login-title"><span>Gabriel</span> <i>&amp;</i> <span>Halanaia</span></h1>
        <p class="album-login-copy" data-album-login-copy>
          Use o mesmo nome da confirmação de presença e a senha do álbum para ver e compartilhar as memórias.
        </p>

        <form class="album-login-form" data-album-login-form novalidate>
          <div class="album-login-known" data-album-known-name hidden>
            <p>
              Entrando como <strong data-album-known-label></strong>
            </p>
            <button class="album-login-switch" type="button" data-album-use-other-name>
              Usar outro nome
            </button>
          </div>

          <label data-album-name-field>
            Nome confirmado no convite
            <input
              name="guestName"
              type="text"
              maxlength="120"
              autocomplete="name"
              placeholder="Ex.: Maria Silva"
              data-album-name-input
              required
            />
          </label>

          <label>
            Senha do álbum
            <input
              name="password"
              type="password"
              maxlength="64"
              autocomplete="current-password"
              placeholder="Senha do álbum"
              data-album-password-input
              required
            />
          </label>

          <p class="album-login-error" data-album-login-error hidden></p>

          <button class="button primary" type="submit" data-album-login-submit>Entrar no álbum</button>
        </form>
      </section>
    </main>

    <script src="/album-login.js?v=2"></script>
  </body>
</html>
